<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="35%" stop-color="#C9A962" />
      <stop offset="70%" stop-color="#B8964E" />
      <stop offset="100%" stop-color="#8C6D2B" />
    </linearGradient>
    <radialGradient id="goldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCEAB3" />
      <stop offset="60%" stop-color="#C9A962" />
      <stop offset="100%" stop-color="#8C6D2B" />
    </radialGradient>
    <!-- Navy Radial Gradient -->
    <radialGradient id="navyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e344d" />
      <stop offset="100%" stop-color="#0a1524" />
    </radialGradient>
    <!-- Text Arc Path -->
    <path id="textArcTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
  </defs>

  <!-- Base Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#navyBg)" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#C9A962" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Outer Concentric Bronze Rings -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#E5D5A8" stroke-width="1" />
  <circle cx="100" cy="100" r="76" fill="none" stroke="#C9A962" stroke-width="1.5" />

  <!-- Dong Son Sun Rays (Central 14-point star) -->
  <g id="sunburst" fill="url(#goldGrad)">
    <polygon points="100,56 103,78 100,74 97,78" />
    <polygon points="100,144 103,122 100,126 97,122" />
    <polygon points="56,100 78,103 74,100 78,97" />
    <polygon points="144,100 122,103 126,100 122,97" />
    <polygon points="69,69 88,82 85,80 82,85" />
    <polygon points="131,131 112,118 115,120 118,115" />
    <polygon points="69,131 82,115 85,120 88,118" />
    <polygon points="131,69 118,85 115,80 112,82" />
    <polygon points="82,60 92,79 89,77 87,81" />
    <polygon points="118,140 108,121 111,123 113,119" />
    <polygon points="60,118 79,108 77,111 81,113" />
    <polygon points="140,82 121,92 123,89 119,87" />
    <polygon points="60,82 79,92 77,89 81,87" />
    <polygon points="140,118 121,108 123,111 119,113" />
  </g>

  <!-- Central Medallion Circle -->
  <circle cx="100" cy="100" r="32" fill="#0a1524" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="28" fill="none" stroke="#E5D5A8" stroke-width="0.8" stroke-dasharray="2,2" />

  <!-- Monogram LN (Lộc Nam) in Royal Gold -->
  <text x="100" y="108" font-family="'Times New Roman', Georgia, serif" font-size="23" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">LN</text>

  <!-- Curved Text: TRANH ĐỒNG LỘC NAM -->
  <text fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="2.8">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      TRANH ĐỒNG LỘC NAM
    </textPath>
  </text>

  <!-- Small Bottom Subtitle / Stars -->
  <g fill="#FFD700">
    <polygon points="100,166 102,170 106,170 103,172 104,176 100,174 96,176 97,172 94,170 98,170" transform="scale(0.8) translate(25, 38)" />
    <text x="100" y="172" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="700" fill="#E5D5A8" text-anchor="middle" letter-spacing="1.5">NGHỆ THUẬT ĐÚC ĐỒNG</text>
  </g>
</svg>
